name = "free-foil"
version = "0.1.0"
defaultTargets = ["FreeFoil", "lambdaPi", "mltt", "nbe"]
testDriver = "freeFoilTests"

[[lean_lib]]
name = "FreeFoil"
roots = ["FreeFoil", "FreeFoil.Examples.LambdaPi", "FreeFoil.Examples.LambdaPi.NbE", "FreeFoil.Examples.LambdaPi.Program", "FreeFoil.Examples.NbEDemos.Program", "FreeFoil.Examples.DependentTypes.Program", "FreeFoil.Examples.SOAS", "FreeFoil.Examples.MLTT"]

[[lean_exe]]
name = "lambdaPi"
root = "LambdaPiMain"

[[lean_exe]]
name = "mltt"
root = "MLTTMain"

[[lean_exe]]
name = "nbe"
root = "NbEMain"

[[lean_exe]]
name = "nbeBench"
root = "NbEBenchMain"

[[lean_exe]]
name = "lambdaNWaysBench"
root = "LambdaNWaysBenchMain"

[[lean_exe]]
name = "freeFoilTests"
root = "Test"
needs = ["mltt"]
